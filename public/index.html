<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모비노기 숙제 도우미</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

<div id="loading-spinner" class="spinner-overlay">
    <div class="spinner"></div>
    <p>데이터를 불러오는 중...</p>
</div>

<div class="container">
    <header class="header">
        <h1>모비노기 숙제 도우미</h1>
        <div class="header-actions-wrap">
            <button id="auth-btn" class="icon-btn auth-btn-style" title="구글 계정 연동 (데이터 백업)">💾</button>
            <button id="theme-toggle" class="icon-btn theme-toggle-style" title="테마 변경">🌙</button>
        </div>
    </header>

    <div class="top-grid">
        <div class="card card-abyss-custom">
            <div class="card-header header-no-border">
                <h2 class="abyss-title-text">어비스 구멍</h2>
                <div class="toggle-group">
                    <button id="btn-noti-toggle" class="btn-schedule-toggle" title="알림 켜기">🔔</button>
                    <button id="btn-abyss-schedule" class="btn-schedule-toggle">📅 일정표</button>
                    <button id="btn-abyss-edit" class="toggle-btn" title="기준 시간 변경">✏️</button>
                </div>
            </div>
            
            <div id="abyss-display-wrap">
                <div class="abyss-main">
                    <div class="abyss-icon">🌀</div>
                    <div class="abyss-info">
                        <div class="abyss-time" id="abyss-next-time">시간을 설정해주세요</div>
                        <div class="abyss-countdown" id="abyss-countdown"></div>
                    </div>
                </div>
                <div class="abyss-timeline hidden" id="abyss-timeline"></div>
            </div>

            <div class="add-wrap hidden" id="add-wrap-abyss">
                <div class="inline-form-box">
                    <div class="form-row">
                        <input type="datetime-local" id="input-abyss" class="w-100">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel" id="btn-abyss-cancel">취소</button>
                        <button type="button" class="btn-submit" id="btn-abyss-save">적용</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>📢 공지사항</h2>
                <button id="btn-notice-add-toggle" class="toggle-btn" title="공지 추가">＋</button>
            </div>
            <ul class="task-list notice-list-custom" id="list-notice"></ul>
            <div class="add-wrap hidden" id="add-wrap-notice">
                <div class="inline-form-box">
                    <div class="form-row">
                        <input type="text" id="input-notice-title" placeholder="공지 제목" style="flex: 1;">
                        <input type="text" id="input-notice-url" placeholder="링크 URL (선택)" style="flex: 1;">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel" onclick="document.getElementById('add-wrap-notice').classList.add('hidden')">취소</button>
                        <button type="button" class="btn-submit" id="btn-notice-save">추가</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="card full-width">
            <div class="card-header">
                <h2>🎉 진행 중인 이벤트</h2>
                <button id="btn-event-add-toggle" class="toggle-btn" title="이벤트 추가">＋</button>
            </div>
            <ul class="event-list" id="list-event"></ul>
            <div class="add-wrap hidden" id="add-wrap-event"></div>
        </div>

        <div class="card full-width">
            <div class="card-header">
                <h2>📝 공통 메모</h2>
                <button id="btn-memo-add-toggle" class="toggle-btn" title="메모 추가">＋</button>
            </div>
            <ul class="task-list" id="list-memo"></ul>
            <div class="add-wrap hidden" id="add-wrap-memo">
                <div class="inline-form-box">
                    <div class="form-row">
                        <textarea id="input-memo" placeholder="새로운 공통 메모 내용 입력" class="w-100" style="resize: none; min-height: 60px;"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel" onclick="document.getElementById('add-wrap-memo').classList.add('hidden')">취소</button>
                        <button type="button" class="btn-submit" id="btn-memo-save">추가</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tabs-container" id="tabs-container"></div>
    <div class="char-grid" id="character-content"></div>
</div>

<div class="modal-overlay" id="char-add-modal">
    <div class="modal-box modal-box-small">
        <h3 class="modal-title-small">새 캐릭터 추가</h3>
        <input type="text" id="char-add-name" class="modal-input-styled" placeholder="새 캐릭터 이름">
        <div class="modal-btn-row">
            <button id="btn-char-add-submit" class="modal-btn modal-btn-primary-styled">추가</button>
            <button id="btn-char-add-cancel" class="modal-btn modal-btn-secondary-styled">취소</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="delete-modal">
    <div class="modal-box">
        <h3>항목 삭제</h3>
        <p>어떻게 삭제하시겠습니까?<br>(개별 삭제 시 이 캐릭터의 화면에서만 숨겨집니다.)</p>
        <button id="btn-del-local" class="modal-btn btn-del-local">현재 캐릭터만 개별 삭제</button>
        <button id="btn-del-all" class="modal-btn btn-del-all">모든 캐릭터에서 삭제</button>
        <button id="btn-del-cancel" class="modal-btn btn-del-cancel">취소</button>
    </div>
</div>

<div class="modal-overlay" id="char-modal">
    <div class="modal-box modal-box-small">
        <h3 class="modal-title-small">캐릭터 설정</h3>
        <input type="text" id="char-edit-name" class="modal-input-styled" placeholder="캐릭터 이름">
        <div class="modal-btn-row-spaced">
            <button id="btn-char-edit-save" class="modal-btn modal-btn-primary-styled">저장</button>
            <button id="btn-char-edit-cancel" class="modal-btn modal-btn-secondary-styled">취소</button>
        </div>
        <button id="btn-char-delete" class="btn-text-danger">이 캐릭터 삭제</button>
    </div>
</div>

<div id="toast-container"></div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
